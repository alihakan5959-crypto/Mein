name: Build NetPulse APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build signed debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NetPulse-Android-0.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/NetPulse-Android-0.2.apk
          sha256sum dist/NetPulse-Android-0.2.apk > dist/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Screen-0.2
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
